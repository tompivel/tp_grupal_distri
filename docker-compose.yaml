# Despliegue mínimo: RabbitMQ, un gateway, un cliente y el pipeline inicial.
#
# Crear un archivo CSV en ./runtime/input/input.csv antes de iniciar el cliente.
# Ejecutar:
#   docker compose config
#   docker compose build
#   docker compose up
services:
  rabbitmq:
    build:
      context: ./src/rabbitmq
      dockerfile: Dockerfile
    container_name: tp-grupal-rabbitmq
    environment:
      RABBITMQ_LOG_LEVELS: error
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    ports:
      - "5672:5672"
      - "15672:15672"

  gateway:
    build:
      context: ./src
      dockerfile: gateway/Dockerfile
    container_name: tp-grupal-gateway
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      INPUT_QUEUE: results
      OUTPUT_QUEUE: input
      MOM_HOST: rabbitmq
      MOM_PORT: "5672"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "5678"
    ports:
      - "5678:5678"

  client:
    build:
      context: ./src
      dockerfile: client/Dockerfile
    container_name: tp-grupal-client
    depends_on:
      gateway:
        condition: service_started
    environment:
      SERVER_HOST: gateway
      SERVER_PORT: "5678"
      INPUT_FILE: /runtime/input/input.csv
      OUTPUT_FILE: /runtime/output/output.csv
    volumes:
      - ./runtime:/runtime

  project:
    build:
      context: ./src
      dockerfile: workers/project/Dockerfile
    container_name: tp-grupal-project
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      ID: "0"
      MOM_HOST: rabbitmq
      MOM_PORT: "5672"
      INPUT_QUEUE: input
      PROJECT_AMOUNT: "1"
      PROJECT_PREFIX: project

  date-filter:
    build:
      context: ./src
      dockerfile: workers/dateFilter/Dockerfile
    container_name: tp-grupal-date-filter
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      ID: "0"
      MOM_HOST: rabbitmq
      MOM_PORT: "5672"
      PROJECT_PREFIX: project
      DATE_FILTER_AMOUNT: "1"
      DATE_FILTER_PREFIX: dateFilter

  english-filter:
    build:
      context: ./src
      dockerfile: workers/englishFilter/Dockerfile
    container_name: tp-grupal-english-filter
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      ID: "0"
      MOM_HOST: rabbitmq
      MOM_PORT: "5672"
      DATE_FILTER_PREFIX: dateFilter
      ENGLISH_FILTER_AMOUNT: "1"
      ENGLISH_FILTER_PREFIX: englishFilter
