syntax = "proto3";

package internal;

import "common.proto";
import "external_messages.proto";

option go_package = "github.com/7574-sistemas-distribuidos/tp-grupal-distri/gen/proto";

message InternalMessage {
  string client_id = 1;

  oneof payload {
    common.Article article = 2;
    ProjectedArticle projected_article = 3;
    DateFiltered date_filtered = 4;
    TokenizedAbstract tokenized_abstract = 5;
    EndOfFile end_of_file = 6;
    external.ResultBatch result_batch = 7;
    external.AllFinished all_finished = 8;
  }
}

message EndOfFile {}

message ProjectedArticle {
  string name = 1; 
  string url = 2; 
  string date_modified = 3;
  common.ArticleLanguage in_language = 4;
  string abstract = 5;
  common.ArticleImage image = 6;
  repeated common.ArticleItem sections = 7;
}

message DateFiltered {
  string name = 1; 
  string url = 2; 
  string date_modified = 3;
  common.ArticleLanguage in_language = 4;
  common.ArticleImage image = 5;
  repeated common.ArticleItem sections = 6;
}

message TokenizedAbstract {
  repeated string abstract_words = 1; 
  string url = 2; 
  string date_modified = 3;
  common.ArticleLanguage in_language = 4;
}
