syntax = "proto3";

package external;

import "common.proto";

option go_package = "github.com/7574-sistemas-distribuidos/tp-grupal-distri/gen/proto/external";

message ExternalMessage {
  oneof payload {
    common.Article article = 1;
    EndOfFile end_of_file = 2;
    ACK ack = 3;
    ResultBatch result_batch = 4;
    AllFinished all_finished = 5;
  }
}

message EndOfFile {}

message ACK {}

message ResultBatch {
  uint32 query_id = 1;
  repeated QueryResult results = 2;
}

message QueryResult {
  oneof result {
    Q1Result q1 = 1;
    Q2Result q2 = 2;
    Q3Result q3 = 3;
    Q4Result q4 = 4;
    Q5Result q5 = 5;
  }
}

message Q1Result {
  string url = 1;
  string date_modified = 2;
}

message Q2Result {
  string name = 1;
  string url = 2;
  bytes image_bytes = 3;
}

message Q3Result {
  string english_word = 1;
  string french_word = 2;
}

message Q4Result {
  repeated WordAppearances top = 1;
}

message WordAppearances {
  string word = 1;
  uint64 count = 2;
}

message Q5Result {
  string url = 1;
  uint64 count = 2;
}

message AllFinished {}
